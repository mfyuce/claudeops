# claudeops tmux socket ("-L cops") config — bundled in-repo, static (no runtime
# generation → no first-write race between concurrent spawns).
#
# set-titles-string "#S": window title = bare session name → layout.py's exact-string
# title match keeps working unchanged (VTE relays this via the pty's OSC sequence).
# remain-on-exit off (tmux's own default, pinned explicitly): killing the wrapped
# claude process destroys the now-empty pane/session immediately, so the next
# `new-session -A` never finds a dead "Pane is dead" placeholder.
set-option -g set-titles on
set-option -g set-titles-string "#S"
set-option -g status off
set-option -g remain-on-exit off
set-option -g focus-events on
# mouse on: without it tmux never sees/relays real wheel events, so the outer
# terminal falls back to translating wheel-scroll into literal Up/Down key
# presses (lands in whatever has focus — claude's input box — instead of
# scrolling). With mouse on, wheel-up over the pane's normal/alt-screen
# content properly scrolls tmux's own history (restores native-terminal feel).
set-option -g mouse on
