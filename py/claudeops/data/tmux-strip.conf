# claudeops pencere şeridi (TODO.md 2026-10-16, TBD#86): YEREL session pencerelerinin altındaki durum satırı.
# Satır sayısı (panelin Terminal göstergesiyle aynı: history_size / history-limit) + eylem menüsü
# (Handover, Durdur + yeni isimle başlat, Durdur, Yeni chat aç, Sıfırla).
#
# BU DOSYA YALNIZ tmux >= 3.2'DE YÜKLENİR: ana tmux.conf onu sürüm kapısıyla çağırır. Neden ayrı dosya: tmux, bir
# yapılandırma dosyasında tanınmayan TEK bir bayrak ya da komut görürse dosyanın HİÇBİR satırını uygulamaz (öncesindekileri
# de), yani buradaki satırlar ana dosyada olsaydı 3.0a'lı bir host (yuhem) set-titles/history-limit/mouse ayarlarını da
# kaybederdi. Burada gerekenler: `set -F` (3.2), `run-shell -C` (3.2), `display-message -d` (3.2, winact'in mesajı),
# `display-menu` (3.0).
#
# Etkinleşme: tmux sunucusu `-f` dosyasını yalnız BAŞLARKEN okur; çalışan bir sunucuda
# `tmux -L cops source-file <ana tmux.conf>` ile (idempotent) uygulanır. Şerit pane'i 1 satır kısaltır.

# Eylem başlatıcısı: bu dosyanın iki üst dizinindeki `cops` (py/claudeops/data/ -> py/cops). Yol mutlak çıkar, çünkü
# spawn `-f`yi mutlak verir (tmux_backend.tmux_conf_path).
set -gF @cops_py "#{d:current_file}/../../cops"

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=colour236,fg=colour252"
set -g status-left-length 40
set -g status-left " #[bold]#S#[nobold] │ "
# Her session tek pencere: "0:bash*" pencere listesi yalnız gürültü. Birden çok pencere varsa (elle `C-b c`) liste tmux'un
# varsayılan biçimiyle görünür; tek pencerede boş (`window-status-format` yalnız AKTİF olmayan pencerelere uygulanır,
# yani birden çok pencere olmadıkça hiç kullanılmaz).
set -g window-status-current-format "#{?#{e|>:#{session_windows},1},#I:#W#{?window_flags,#{window_flags}, },}"
# Satır sayısı: alternate-screen'deyken history_size YAPISAL olarak ~0'da donar (tmux_backend.tmux_pane_size), panelin
# göstergesi de o durumda gizleniyor; burada "alt ekran" yazar. 1900 = Ayarlar'daki `history_warn_at` VARSAYILANI
# (tmux.conf statik, Ayarlar'ı okuyamaz); eşiği aşınca amber (panelin amber'ı ile aynı dil). Karşılaştırma `e|>=`
# (SAYISAL): düz `>=` SÖZLÜKSEL, "999" >= "1900" doğru çıkar ve sayaç 970 satırda amber olurdu (mutasyon turunda
# yakalandı). Sağ blokun TAMAMI düğmedir:
# tıklama aşağıdaki MouseDown1StatusRight ile menüyü açar (tmux 3.2a'da `range=user|...` ayrı bir tıklama bölgesi
# OLUŞTURMUYOR, tıklama düz StatusRight olarak geliyor; denendi).
set -g status-right-length 90
set -g status-right "#{?alternate_on,#[fg=colour245]alt ekran#[default],#{?#{e|>=:#{history_size},1900},#[fg=colour214 bold],}#{history_size}/#{history_limit} satır#[default]} │ #[bg=colour24,fg=colour255,bold] İşlemler ▾ #[default] "

# Menü TEK yerde tanımlı (seçenek), hem `C-b a` hem sağ şerit bloğuna tıklama onu `run-shell -C "#{@cops_menu}"` ile açar.
# KRİTİK (denendi): display-menu, öğe KOMUTLARINDAKİ biçimleri ÖNCE genişletip sonra yeniden ayrıştırıyor. Oturum adı gibi
# serbest bir metin (`we'ird name`) tırnaklı komut metnine girerse tırnaklar bozulur, menü sessizce çalışmaz. Bu yüzden
# komutlara oturum adı HİÇ girmez: `winact` yalnız tmux istemci adını (`/dev/pts/N`, güvenli karakterler) alır, oturum
# adını tmux'tan VERİ olarak çözer (list-clients). Onay istemlerindeki ad `s/[^A-Za-z0-9_.-]/_/` ile güvenli karakterlere
# indirgenir (olağan adlarda aynen görünür). Yıkıcı üç eylem (y, d, r) `confirm-before` ister. `-b`: arka planda (bir
# eylem 10+ sn sürebilir, tmux arayüzü beklemesin).
set -g @cops_menu "display-menu -T '#[align=centre] #{session_name} ' -x P -y P \
  'Handover' h \"run-shell -b '#{q:@cops_py} winact handover --client #{q:client_name}'\" \
  'Durdur + yeni isimle başlat' y \"confirm-before -p 'Durdur + yeni isimle başlat: #{s/[^A-Za-z0-9_.-]/_/:session_name}? (y/n)' \\\"run-shell -b '#{q:@cops_py} winact restart --client #{q:client_name}'\\\"\" \
  'Durdur' d \"confirm-before -p 'Durdur: #{s/[^A-Za-z0-9_.-]/_/:session_name}? (y/n)' \\\"run-shell -b '#{q:@cops_py} winact stop --client #{q:client_name}'\\\"\" \
  'Yeni chat aç' n \"run-shell -b '#{q:@cops_py} winact newchat --client #{q:client_name}'\" \
  'Sıfırla' r \"confirm-before -p 'SIFIRLA (konuşma bir daha görünmez): #{s/[^A-Za-z0-9_.-]/_/:session_name}? (y/n)' \\\"run-shell -b '#{q:@cops_py} winact reset --client #{q:client_name}'\\\"\""

bind-key a run-shell -C "#{@cops_menu}"
# Sağ şerit bloğuna (satır sayısı + düğme) tıklama menüyü açar. Sol blok (ad) ve boşluk tmux'un varsayılanında kalır.
bind-key -n MouseDown1StatusRight run-shell -C "#{@cops_menu}"
