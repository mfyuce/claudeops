[package]
name = "screenshare"
version = "0.1.0"
edition = "2024"

[dependencies]
enigo = "0.6.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tungstenite = "0.30.0"
x11rb = { version = "0.14.0", features = ["xtest"] }
