[workspace]
resolver = "2"
members = ["crates/cops-proxy", "crates/copsd", "crates/cops-auth", "crates/cops-local", "crates/cops-metrics", "crates/cops-progress", "crates/commit-gate", "crates/cops-hosts", "crates/cops-state", "crates/cops-parity", "crates/cops-tmux", "crates/cops-procscan", "crates/cops-cli", "crates/cops-review-core", "crates/cops-steward-core", "crates/cops-ep-state", "crates/cops-ep-term"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "signal"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"

# R-B2a-5 (28 Kas gözden geçirme): copsd B2a'da regex yığını erişilebilir olunca 6,50 -> 9,05 MB; sembol tablosu atılınca
# -2,06 MB (ölçüldü). Panik geri izi simgesiz olur. regex özellik daraltması ve LTO ayrı iş (tüm çalışma alanı + parite).
[profile.release]
strip = true
