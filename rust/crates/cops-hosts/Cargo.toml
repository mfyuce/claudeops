[package]
name = "cops-hosts"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true, features = ["sync"] }
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
cops-auth = { path = "../cops-auth" }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14"
prost = "0.14"
tower-service = "0.3"
http = "1"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["sync", "test-util"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "server", "router"] }
# Yalnız testlerde: özel kök + yaprak sertifika üretimi (üretim TLS doğrulamasına dokunmaz).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
