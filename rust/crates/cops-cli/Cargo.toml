[package]
name = "cops-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "cops-rs: claudeops CLI'ın Rust ikilisi (strangler; bilinmeyen komut Python py/cops'a devredilir)"

[lib]
name = "cops_cli"
path = "src/lib.rs"

[[bin]]
name = "cops-rs"
path = "src/main.rs"

[dependencies]
cops-proxy = { path = "../cops-proxy" }
cops-auth = { path = "../cops-auth" }
cops-procscan = { path = "../cops-procscan" }
cops-state = { path = "../cops-state" }
libc = "0.2"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
