[package]
name = "cops-providers"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "CLI saglayicilari: spawn komut satiri ve ortam (saf cekirdek) + gercek G/C uygulayicisi (`real`); Python py/claudeops/providers paritesi"

[dependencies]
# strip_ansi tek kaynak (Python tmux_backend.strip_ansi paritesi rs/tmux'ta)
cops-tmux = { path = "../cops-tmux" }
# G9 gerçek süreç taraması (`real/scan.rs`; Python `discovery.find_sessions`)
cops-procscan = { path = "../cops-procscan" }
# Claude fiyat tablosu tek kaynak (Python `review.ANTHROPIC_PRICES`, `HAIKU_LONG_PRICE`)
cops-review-core = { path = "../cops-review-core" }
serde = "1"
serde_json = "1"
regex = "1"
fancy-regex = "0.14"
sha1 = "0.10"
# `real` (gercek G/C uygulayicisi)
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.22"
# HTTP: workspace'teki hyper; TLS secimi rs/hosts ile ayni (rustls + ring, sistem kok sertifikalari)
tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"

[dev-dependencies]
tempfile = "3"
# yalniz testlerde: loopback TLS sunucusu icin sertifika uretimi (uretim dogrulamasina dokunmaz)
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
