[package]
name = "cops-providers"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "CLI saglayicilari: spawn komut satiri ve ortam (saf cekirdek) + gercek G/C uygulayicisi (`real`); Python py/claudeops/providers paritesi"

[dependencies]
serde = "1"
serde_json = "1"
regex = "1"
fancy-regex = "0.14"
sha1 = "0.10"
# `real` (gercek G/C uygulayicisi)
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
