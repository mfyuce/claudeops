[package]
name = "copsd"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
cops-proxy = { path = "../cops-proxy" }
cops-auth = { path = "../cops-auth" }
tokio.workspace = true
cops-metrics = { path = "../cops-metrics" }
cops-progress = { path = "../cops-progress" }
# B0: durum bağlamı (salt okuma yüzü `state::ReadDocs`) ve tmux yutulan hata günlüğü. `cops-steward-core` BAĞLANMAZ
# (serde_json `preserve_order` copsd ikilisine yayılır: docs/rs-b0.md R1).
cops-state = { path = "../cops-state" }
cops-tmux = { path = "../cops-tmux" }
# B1: salt okuma durum uçları (`/api/instances` yerel dalı, `/api/diag/log`); `cops-state` salt okuma kipiyle.
cops-ep-state = { path = "../cops-ep-state" }
cops-procscan = { path = "../cops-procscan" }
# B2a: terminal okuma uçları (`/api/term/output|history` yerel dalı); yazan uç yok.
cops-ep-term = { path = "../cops-ep-term" }

[dev-dependencies]
serde_json = "1"
cops-parity = { path = "../cops-parity" }
rusqlite = { version = "0.37", features = ["bundled"] }

[[test]]
name = "ctx_front"
harness = false
