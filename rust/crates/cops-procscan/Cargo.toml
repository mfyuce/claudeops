[package]
name = "cops-procscan"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
cops-state = { path = "../cops-state" }
libc = "0.2"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] } # copsd boyutu (R-B2a-5): yalnız \s/\d; (?i) ya da \p{..} eklenirse özellik ekle
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
